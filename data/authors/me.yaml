bio: |
  I am Yue Lei, and I entered the field of psychology in 2015. During my master's studies, my research interest was materialistic values. For various reasons, starting in 2021, my research interests gradually shifted to the science of science.
  I have always believed that scientific development needs people to venture into uncharted territory, but it also needs people to stop, look back at the path already traveled, and reflect on the current problems of scientific development. Therefore, in recent years I have focused on open science and metascience in psychology.
  I hope that you, visiting my homepage, will also find something to think about in the moments when you help psychology move forward.

