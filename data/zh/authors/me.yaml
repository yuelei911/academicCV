bio: |
  我是岳磊，我从2015年开始进入心理学。在硕士研究生期间，我的研究兴趣为物质主义价值观。在各种原因之下，从2021年开始，我的研究兴趣逐渐转向科学学。
  我始终认为，科学发展需要有人至无人之境，也需要有人停下来，回顾来时之路，思考当前科学发展的问题。因此，我近几年一直专注于心理学领域的开放科学和元科学。
  希望看到我个人主页的你，也能在推动心理学更好前进的片刻，有所思考。

